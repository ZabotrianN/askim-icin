<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seni Hala Çok Seviyorum</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: url('https://i.ibb.co/KzXWb059/asd.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Arial', sans-serif;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .box {
      background: rgba(0,0,0,0.4);
      padding: 40px;
      border-radius: 20px;
      max-width: 90%;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .line {
      opacity: 0;
      animation: slideUp 1s forwards;
    }

    .line:nth-child(1) { animation-delay: 0.5s; }
    .line:nth-child(2) { animation-delay: 2s; }
    .line:nth-child(3) { animation-delay: 3.5s; }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    #playButton {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background-color: #ffd700;
      color: black;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #playButton:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1 class="line">❤️ UNUTMADIM ❤️</h1>
    <p class="line">
      Bu siteyi kapatmamış olman beni sevindiriyo ne zaman bu şarkıyı açacak olsam spotify dan değil burdan açıyorum<br>
      <br>
      Ömrüm… 💫
    </p>
    <p class="line" style="margin-top:20px; font-style:italic; color:#ffd700;">
      Seni bununla tanımadım ama bizi temsil eden bu. 😏🎶
    </p>

    <!-- Müzik başlat butonu -->
    <button id="playButton" onclick="playMusic()">Basarken geçmişi hatırla 14 gün sonra 1.YIL 🎵</button>
  </div>

  <!-- Audio -->
  <audio id="music" loop>
    <!-- Kendi mp3 dosyanla değiştir -->
    <source src="https://cdn.jsdelivr.net/gh/ZabotrianN/askim-icin/belalim.mp3" type="audio/mp3">
  </audio>

  <script>
    function playMusic() {
      const music = document.getElementById('music');
      music.play();
    }
  </script>
</body>
</html>
