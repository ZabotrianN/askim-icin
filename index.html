<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Sana Bir Şey Söylemek İstedim</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: url('https://i.ibb.co/RkfNvnd0/RkfNvnd0.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Arial', sans-serif;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .box {
      background: rgba(0,0,0,0.4);
      padding: 40px;
      border-radius: 20px;
      max-width: 600px;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .line {
      opacity: 0;
      animation: slideUp 1s forwards;
    }

    .line:nth-child(1) { animation-delay: 0.5s; }
    .line:nth-child(2) { animation-delay: 2s; }
    .line:nth-child(3) { animation-delay: 3.5s; }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1 class="line">❤️ Aşkım ❤️</h1>
    <p class="line">
      Kodlama yapıyorum dedim de kendim için demedim<br>
      Senin için de yaptım, gözlerinin içini güldürebiliyorsam ne mutlu bana 💖<br>
      Ömrüm… 💫
    </p>
    <p class="line" style="margin-top:20px; font-style:italic; color:#ffd700;">
      Ve tabi ki bir de sana küçük sürprizim var 😏🎶
    </p>
  </div>

  <!-- Belalım şarkısı -->
  <iframe
    width="0"
    height="0"
    src="https://www.youtube.com/embed/pbnUbpZENKA?autoplay=1&loop=1&playlist=pbnUbpZENKA"
    frameborder="0"
    allow="autoplay"
  ></iframe>
</body>
</html>
